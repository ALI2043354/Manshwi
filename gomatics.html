<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>الشيخ المنشاوي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        h1 {
            color: green;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
            padding: 5px;
        }
        th {
            background-color: #f2f2f2;
        }
        button {
            background-color: green;
            color: rgb(242, 29, 29);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        img {
            max-width: 200px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>موقع الشيخ محمد صديق المنشاوي</h1>
    <img src="menshawy.jpg" alt="">
    
    <table>
        <tr>
            <th>اسم السورة</th>
            <th>عدد الآيات</th>
            <th>نوع السورة</th>
        </tr>
        <tr>
            <td>الفاتحة</td>
            <td>7</td>
            <td>مكية</td>
        </tr>
        <tr>
            <td>يس</td>
            <td>83</td>
            <td>مكية</td>
        </tr>
        <tr>
            <td>الرحمن</td>
            <td>78</td>
            <td>مدنية</td>
        </tr>
        <tr>
            <td>الواقعة</td>
            <td>96</td>
            <td>مكية</td>
        </tr>
    </table>
    
    <button onclick="alert('تم الضغط على الزر!')">استماع للتلاوة</button>
    
    <p>روائع سيدنا المنشاوي </p>
        <img src="menshawy2.jpg" alt="">
        <video src="ali3.mp4"></video>
        <form dir="rtl">
            <div>
              <label for="username">اسم المستخدم:</label>
              <input type="text" id="username" name="username">
            </div>
            <div>
              <label for="password">كلمة المرور:</label>
              <input type="password" id="password" name="password">
            </div>
            <div>
              <button type="submit">تسجيل الدخول</button>
            </div>
          </form>
          
          <!-- تنسيق بسيط للفورم -->
          <style>
            form {
              width: 300px;
              margin: 0 auto;
              padding: 20px;
              border: 1px solid #ccc;
              border-radius: 5px;
            }
            
            form div {
              margin-bottom: 10px;
            }
            
            label {
              display: block;
              margin-bottom: 5px;
            }
            
            input {
              width: 100%;
              padding: 8px;
              border: 1px solid #ddd;
              border-radius: 4px;
            }
            
            button {
              background-color: green;
              color: white;
              padding: 10px 15px;
              border: none;
              border-radius: 4px;
              cursor: pointer;
            }
            
            button:hover {
              background-color: darkgreen;
            }
          </style>
</body>
</html>
